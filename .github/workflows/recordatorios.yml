name: Recordatorios diarios

# 13:00 UTC = 10:00 de la mañana en Argentina (UTC-3). El cron de GitHub
# siempre va en UTC y no ajusta por horario de verano, así que si algún día
# cambia el huso hay que corregir este número a mano.
#
# Nota: GitHub puede demorar la ejecución unos minutos si hay mucha carga.
# Para una tarea diaria no es un problema.
on:
  schedule:
    - cron: "0 13 * * *"
  # Permite dispararlo a mano desde la pestaña Actions, con la opción de
  # hacerlo en modo prueba (no manda mails, solo muestra a quién le tocaría).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo prueba (no envía mails)"
        type: boolean
        default: true
      test_email:
        description: "Mandar UN mail de prueba a esta dirección (deja vacío para el envío normal)"
        type: string
        default: ""

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Enviar recordatorios
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python enviar_recordatorios.py
